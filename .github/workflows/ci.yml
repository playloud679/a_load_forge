# Compile, critical lint, release metadata, full suite and AppTest smoke.
name: CI

on:
  push:
    branches: [dev, master, experimental]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Check release version metadata
        run: python tools/check_version_consistency.py

      - name: Compile
        run: python -m py_compile ui_app.py src/*.py src/ui/*.py tests/test_all.py

      - name: Lint refactored UI surface
        run: python -m ruff check --select F401,F811,F821,I001 ui_app.py src/ui

      - name: Test suite
        run: python tests/test_all.py

      - name: Streamlit AppTest smoke
        run: >
          python -c 'from streamlit.testing.v1 import AppTest;
          at = AppTest.from_file("ui_app.py", default_timeout=60);
          at.run();
          assert not at.exception, at.exception;
          print("AppTest OK")'
