[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "load-forge"
version = "0.12.32"
description = "Load Forge - Advanced Multi-Topology Acoustic Load Design & Optimizer (DCCAV, reflex, sealed, passive radiator, bandpass)"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
    "streamlit>=1.58.0",
    "altair>=5.0.0",
    "pandas>=2.0.0",
    "Authlib>=1.3.2",
    "google-cloud-firestore>=2.19.0",
    "pypdf>=5.0.0",
    "trimesh>=4.0,<5",
    "manifold3d>=3.0,<4",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "mypy>=1.10"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.ruff.lint]
# Lenient on purpose: keep the simulator code honest without churning style.
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Both files must extend sys.path before importing the src modules.
"ui_app.py" = ["E402"]
"tests/test_all.py" = ["E402"]
