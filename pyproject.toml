[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "horn-generator"
version = "2.1.0"
description = "Parametric STL generator for acoustic horns"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "numpy-stl>=3.0.0",
    "trimesh>=4.0.0",
    "manifold3d>=3.0.0",
    "streamlit>=1.28.0",
    "requests>=2.28.0",
    "matplotlib>=3.5.0",
]

[project.scripts]
horn = "src.main:main"
