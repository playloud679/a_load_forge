[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "flare_forge"
version = "2.20.10"
description = "Parametric STL generator for acoustic horns"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "numpy-stl>=3.0.0",
    "trimesh[easy]>=4.0.0",
    "manifold3d>=3.0.0",
    "streamlit>=1.28.0",
    "extra-streamlit-components>=0.1.70",
    "posthog>=3.0.0",
    "requests>=2.28.0",
    "matplotlib>=3.5.0",
    "shapely>=2.0.0",
    "plotly>=5.18.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4"]

[project.scripts]
horn = "src.main:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Lenient on purpose: keep the geometric code honest (pyflakes, imports,
# modern syntax, common bugs) without churning the existing style.
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
