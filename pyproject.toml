[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "load_forge"
version = "0.1.0"
description = "Streamlit simulator for DCCAV acoustic loudspeaker loads"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
    "streamlit>=1.28.0",
    "altair>=5.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Lenient on purpose: keep the simulator code honest without churning style.
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
