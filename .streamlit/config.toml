# Load Forge — Streamlit configuration
#
# Keep the app's Python source server-side only. The two settings below stop
# uncaught-exception tracebacks (which embed source-code snippets) from being
# rendered in the user's browser. App users get a generic error; the full
# traceback is written to the server logs (see logger usage in ui_app.py).

[client]
# "none" → no error details in the browser. Use "full" locally while debugging.
showErrorDetails = "none"

[theme]
# The chart palette (pastel traces, cursor labels with dark halo strokes,
# click markers) is tuned for a dark canvas; pin the base theme so systems
# in light mode don't render it washed out.
base = "dark"
primaryColor = "#10B981"

[theme.sidebar]
primaryColor = "#10B981"
backgroundColor = "#050505"
secondaryBackgroundColor = "#101217"
textColor = "#F5F7FA"

[server]
# We never serve files from a static/ folder; keep it off so source/assets
# can't be fetched directly over HTTP.
enableStaticServing = false
